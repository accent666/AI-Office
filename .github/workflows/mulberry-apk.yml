# Сборка Android-приложения MULBERRY (Capacitor) в подписанный release-APK.
# Запуск: вкладка Actions → «MULBERRY APK» → Run workflow (или пуш в mulberry-app/).
# Ключ подписи берётся из секретов репозитория (Settings → Secrets and variables → Actions):
#   MB_KEYSTORE_BASE64   — файл mulberry-release.jks в base64
#   MB_KEYSTORE_PASSWORD — пароль хранилища
#   MB_KEY_ALIAS         — псевдоним ключа (mulberry)
#   MB_KEY_PASSWORD      — пароль ключа
name: MULBERRY APK

on:
  workflow_dispatch:
  push:
    paths:
      - "mulberry-app/**"
      - ".github/workflows/mulberry-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mulberry-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mulberry-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Android SDK (платформа 36)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Зависимости и копирование веб-части в Android-проект
        run: |
          npm ci
          npx cap sync android

      - name: Ключ подписи из секретов
        env:
          MB_KEYSTORE_BASE64: ${{ secrets.MB_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$MB_KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета MB_KEYSTORE_BASE64 — добавь ключ подписи (см. mulberry-app/README.md)"; exit 1
          fi
          echo "$MB_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mulberry-release.jks"

      - name: Сборка release-APK
        working-directory: mulberry-app/android
        env:
          MB_KEYSTORE_FILE: ${{ runner.temp }}/mulberry-release.jks
          MB_KEYSTORE_PASSWORD: ${{ secrets.MB_KEYSTORE_PASSWORD }}
          MB_KEY_ALIAS: ${{ secrets.MB_KEY_ALIAS }}
          MB_KEY_PASSWORD: ${{ secrets.MB_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          VER=$(grep -m1 'versionName' app/build.gradle | sed 's/[^0-9.]//g')
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk "../dist/MULBERRY-$VER.apk"

      - name: Удалить ключ с машины сборки
        if: always()
        run: rm -f "$RUNNER_TEMP/mulberry-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: MULBERRY-apk
          path: mulberry-app/dist/*.apk
          if-no-files-found: error
