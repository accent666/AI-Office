    # MONACO: демо Telegram Mini App (покер/блэкджек), статика
    location = /monaco { return 301 /monaco/; }
    location /monaco/api/ {
        proxy_pass http://127.0.0.1:8098/;
        client_max_body_size 32k;
    }
    # картинки, звуки, шрифты игры: кэш на телефоне на 30 дней (при замене файла — новое имя или ?v=)
    location ~ ^/monaco/(c|s|f)/ {
        root /var/www;
        rewrite ^/monaco/(.*)$ /monaco/$1 break;
        add_header Cache-Control "public, max-age=2592000";
    }
    location /monaco/ {
        alias /var/www/monaco/;
        index index.html;
        add_header Cache-Control "no-cache";
    }
    # лендинг blick. (статика, копия /root/work/blick-site)
